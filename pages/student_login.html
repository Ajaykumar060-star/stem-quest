<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Login - STEM Quest</title>
    <link rel="manifest" href="../public/manifest.json" />
    <link rel="icon" href="../public/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<script src="../public/data-store.js"></script>
<script src="../public/auth.js"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-primary-50 via-background to-secondary-50">
    <!-- Background Pattern -->
    <div class="absolute inset-0 opacity-5">
        <svg class="w-full h-full" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse">
                    <path d="M 10 0 L 0 0 0 10" fill="none" stroke="currentColor" stroke-width="0.5"/>
                </pattern>
            </defs>
            <rect width="100" height="100" fill="url(#grid)"/>
        </svg>
    </div>

    <!-- Header with Language Selector and Status -->
    <header class="relative z-10 p-4 sm:p-6">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <!-- Logo -->
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-gradient-to-br from-primary-600 to-secondary-600 rounded-lg flex items-center justify-center">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-text-primary">STEM Quest</h1>
                    <p class="text-sm text-text-secondary">Learn • Play • Discover</p>
                </div>
            </div>

            <!-- Language Selector and Status -->
            <div class="flex items-center space-x-4">
                <!-- Offline Status Indicator -->
                <div class="flex items-center space-x-2 px-3 py-1 bg-success-50 border border-success-100 rounded-full">
                    <div class="w-2 h-2 bg-success-600 rounded-full animate-pulse"></div>
                    <span class="text-sm font-medium text-success-600">Offline Ready</span>
                </div>

                <!-- Language Selector -->
                <div class="relative">
                    <select class="appearance-none bg-white border border-border rounded-lg px-3 py-2 pr-8 text-sm font-medium text-text-primary focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all duration-200">
                        <option value="en">English</option>
                        <option value="hi">हिंदी</option>
                        <option value="bn">বাংলা</option>
                        <option value="te">తెలుగు</option>
                        <option value="ta">தமிழ்</option>
                    </select>
                    <div class="absolute inset-y-0 right-0 flex items-center pr-2 pointer-events-none">
                        <svg class="w-4 h-4 text-text-tertiary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                        </svg>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="relative z-10 flex-1 flex items-center justify-center px-4 sm:px-6 lg:px-8 py-8">
        <div class="max-w-md w-full space-y-8">
            <!-- Welcome Section -->
            <div class="text-center">
                <div class="mx-auto w-24 h-24 bg-gradient-to-br from-primary-500 to-secondary-500 rounded-2xl flex items-center justify-center mb-6 shadow-elevated">
                    <svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.746 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                    </svg>
                </div>
                <h2 class="text-3xl font-bold text-text-primary mb-2" id="formTitle">Welcome Back!</h2>
                <p class="text-text-secondary" id="formSubtitle">Sign in to continue your STEM learning journey</p>
            </div>

            <!-- Login Form -->
            <div class="card p-8">
                <form class="space-y-6" id="loginForm">
                    <!-- Display Name (shown only when registering) -->
                    <div>
                        <label for="displayName" class="block text-sm font-medium text-text-primary mb-2">
                            Full Name
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <svg class="w-5 h-5 text-text-tertiary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                                </svg>
                            </div>
                            <input id="displayName" name="displayName" type="text" class="input pl-10 hidden" placeholder="Enter your full name" autocomplete="name" />
                        </div>
                    </div>

                    <!-- Username Field -->
                    <div>
                        <label for="username" class="block text-sm font-medium text-text-primary mb-2">
                            Username or Student ID
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <svg class="w-5 h-5 text-text-tertiary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                                </svg>
                            </div>
                            <input id="username" name="username" type="text" required class="input pl-10" placeholder="Enter your username" autocomplete="username" />
                        </div>
                        <div class="error-message hidden text-sm text-error-600 mt-1" id="usernameError"></div>
                    </div>

                    <!-- Password Field -->
                    <div>
                        <label for="password" class="block text-sm font-medium text-text-primary mb-2">
                            Password
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <svg class="w-5 h-5 text-text-tertiary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                                </svg>
                            </div>
                            <input id="password" name="password" type="password" required class="input pl-10 pr-10" placeholder="Enter your password" autocomplete="current-password" />
                            <button type="button" class="absolute inset-y-0 right-0 pr-3 flex items-center" onclick="togglePassword()">
                                <svg class="w-5 h-5 text-text-tertiary hover:text-text-secondary transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24" id="eyeIcon">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                                </svg>
                            </button>
                        </div>
                        <div class="error-message hidden text-sm text-error-600 mt-1" id="passwordError"></div>
                    </div>

                    <!-- Remember Me -->
                    <div class="flex items-center justify-between" id="rememberRow">
                        <div class="flex items-center">
                            <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 text-primary-600 focus:ring-primary-500 border-border rounded transition-colors" />
                            <label for="remember-me" class="ml-2 block text-sm text-text-secondary">
                                Remember me on this device
                            </label>
                        </div>

                        <div class="text-sm">
                            <a href="javascript:void(0)" onclick="forgotPassword()" class="font-medium text-primary-600 hover:text-primary-500 transition-colors">
                                Forgot password?
                            </a>
                        </div>
                    </div>

                    <!-- Login Button -->
                    <div>
                        <button type="submit" id="submitBtn" class="btn-primary w-full py-3 text-base font-semibold shadow-elevated hover:shadow-floating active-press">
                            <span class="flex items-center justify-center space-x-2">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
                                </svg>
                                <span id="submitLabel">Sign In</span>
                            </span>
                        </button>
                    </div>

                    <!-- General Error Message -->
                    <div class="error-message hidden bg-error-50 border border-error-100 text-error-600 px-4 py-3 rounded-lg text-sm" id="generalError"></div>
                </form>

                <!-- Divider -->
                <div class="mt-6">
                    <div class="relative">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-border"></div>
                        </div>
                        <div class="relative flex justify-center text-sm">
                            <span class="px-2 bg-white text-text-secondary">New to STEM Quest?</span>
                        </div>
                    </div>
                </div>

                <!-- Create Account Link -->
                <div class="mt-6">
                    <a href="#" id="createAccountLink" class="w-full flex justify-center py-3 px-4 border border-border rounded-lg shadow-sm bg-white text-sm font-medium text-text-primary hover:bg-surface transition-all duration-200 hover-lift">
                        <span class="flex items-center space-x-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
                            </svg>
                            <span id="createAccountLabel">Create New Account</span>
                        </span>
                    </a>
                </div>
            </div>

            <!-- Trust Signals -->
            <div class="text-center space-y-4">
                <div class="flex items-center justify-center space-x-6 text-sm text-text-secondary">
                    <div class="flex items-center space-x-2">
                        <svg class="w-4 h-4 text-success-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                        </svg>
                        <span>Secure Login</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <svg class="w-4 h-4 text-primary-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0"/>
                        </svg>
                        <span>Works Offline</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <svg class="w-4 h-4 text-accent-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                        </svg>
                        <span>Fast & Reliable</span>
                    </div>
                </div>
                <p class="text-xs text-text-tertiary">
                    © <span id="copyrightYear"></span> STEM Quest. Empowering rural education through technology.
                </p>
            </div>
        </div>
    </main>

    <!-- Background Decoration -->
    <div class="fixed bottom-0 right-0 w-64 h-64 opacity-10 pointer-events-none">
        <img src="https://images.pexels.com/photos/8471916/pexels-photo-8471916.jpeg?auto=compress&cs=tinysrgb&w=400" alt="STEM Education" class="w-full h-full object-cover rounded-tl-full" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1584824486509-112e4181ff6b?q=80&w=2940&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D'; this.onerror=null;" />
    </div>

    <script>
        var isRegisterMode = false;

        // Toggle password visibility
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"/>
                `;
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                `;
            }
        }

        // Switch between login and registration modes
        function setMode(register) {
            isRegisterMode = register;
            const displayName = document.getElementById('displayName');
            const rememberRow = document.getElementById('rememberRow');
            const submitLabel = document.getElementById('submitLabel');
            const formTitle = document.getElementById('formTitle');
            const formSubtitle = document.getElementById('formSubtitle');
            const createAccountLabel = document.getElementById('createAccountLabel');
            const usernameLabel = document.getElementById('username');

            if (register) {
                displayName.classList.remove('hidden');
                displayName.required = true;
                rememberRow.classList.add('hidden');
                submitLabel.textContent = 'Create Account';
                formTitle.textContent = 'Join STEM Quest!';
                formSubtitle.textContent = 'Create your account to start learning';
                createAccountLabel.textContent = 'Already have an account? Sign In';
                usernameLabel.placeholder = 'Choose a username';
            } else {
                displayName.classList.add('hidden');
                displayName.required = false;
                rememberRow.classList.remove('hidden');
                submitLabel.textContent = 'Sign In';
                formTitle.textContent = 'Welcome Back!';
                formSubtitle.textContent = 'Sign in to continue your STEM learning journey';
                createAccountLabel.textContent = 'Create New Account';
                usernameLabel.placeholder = 'Enter your username';
            }
            clearErrors();
        }

        // Form validation and submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const displayName = document.getElementById('displayName').value.trim();
            const rememberMe = document.getElementById('remember-me').checked;
            
            // Clear previous errors
            clearErrors();
            
            // Validation
            let hasErrors = false;
            
            if (!username) {
                showError('usernameError', 'Username is required');
                hasErrors = true;
            }
            
            if (!password) {
                showError('passwordError', 'Password is required');
                hasErrors = true;
            }
            
            if (hasErrors) return;
            
            let result;
            if (isRegisterMode) {
                result = STEMQUEST_STORE.register(username, displayName, password);
            } else {
                result = STEMQUEST_STORE.login(username, password);
            }
            
            if (!result.ok) {
                showError('generalError', result.error);
                return;
            }
            
            if (isRegisterMode) {
                STEMQUEST_STORE.rememberCurrentUser(null);
            } else if (rememberMe) {
                STEMQUEST_STORE.rememberCurrentUser(result.user.username);
            }
            
            // Redirect to dashboard
            window.location.href = 'student_dashboard.html';
        });
        
        function showError(elementId, message) {
            const errorElement = document.getElementById(elementId);
            errorElement.textContent = message;
            errorElement.classList.remove('hidden');
        }

        function forgotPassword() {
            showError('generalError', 'Password reset needs a teacher or admin account in this demo. Try the demo account: student / password123');
        }
        
        function clearErrors() {
            const errorElements = document.querySelectorAll('.error-message');
            errorElements.forEach(element => {
                element.classList.add('hidden');
                element.textContent = '';
            });
        }
        
        // Check if user should be remembered
        window.addEventListener('load', function() {
            const remembered = STEMQUEST_STORE.getRememberedUser();
            if (remembered) {
                document.getElementById('username').value = remembered;
                document.getElementById('remember-me').checked = true;
            } else if (STEMQUEST_STORE.isLoggedIn()) {
                // Already signed in - go straight to dashboard
                window.location.href = 'student_dashboard.html';
            }
        });

        // Toggle between login and registration
        document.getElementById('createAccountLink').addEventListener('click', function(e) {
            e.preventDefault();
            setMode(!isRegisterMode);
        });
        
        // Language selector functionality
        document.querySelector('select').addEventListener('change', function(e) {
            const selectedLang = e.target.value;
            localStorage.setItem('stemquest_language', selectedLang);
        });
        
        // Load saved language preference
        window.addEventListener('load', function() {
            const savedLang = localStorage.getItem('stemquest_language');
            if (savedLang) {
                document.querySelector('select').value = savedLang;
            }
            document.getElementById('copyrightYear').textContent = new Date().getFullYear();
        });
    </script>
</body>
</html>
