<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STEM Quest - Interactive Learning Platform</title>
    <link rel="manifest" href="public/manifest.json" />
    <link rel="icon" href="public/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="css/main.css" />
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: "Arial", sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .loading-container {
        text-align: center;
        color: white;
      }

      .logo {
        font-size: 3rem;
        font-weight: bold;
        margin-bottom: 20px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      }

      .loading-text {
        font-size: 1.2rem;
        margin-bottom: 30px;
        opacity: 0.9;
      }

      .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top: 4px solid white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .redirect-message {
        margin-top: 20px;
        font-size: 0.9rem;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div class="loading-container">
      <div class="logo">🚀 STEM Quest</div>
      <div class="loading-text">
        Welcome to your interactive STEM learning adventure!
      </div>
      <div class="spinner"></div>
      <div class="redirect-message">Redirecting to login... <span style="color:#fff">© <span id="year"></span> STEM Quest</span></div>
    </div>

    <script>
      // Set current year in footer
      document.getElementById("year").textContent = new Date().getFullYear();

      // Redirect to student login page after 2 seconds
      setTimeout(function () {
        window.location.href = "pages/student_login.html";
      }, 2000);

      // Fallback redirect in case of any issues
      window.addEventListener("load", function () {
        setTimeout(function () {
          if (
            window.location.pathname.endsWith("index.html") ||
            window.location.pathname.endsWith("/")
          ) {
            window.location.href = "pages/student_login.html";
          }
        }, 3000);
      });
    </script>
  </body>
</html>
